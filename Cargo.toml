[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
hashbrown = "0.15"
ahash = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7"
arrow = "54.2"
parquet = { version = "54.2", default-features = false, features = ["arrow", "snap"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = true
